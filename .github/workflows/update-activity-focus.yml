name: Update GitHub Activity Charts

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate GitHub activity charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: AliZahiri
          GITHUB_ACTIVITY_DAYS: "365"
        run: python scripts/generate_activity_focus.py

      - name: Commit updated charts
        run: |
          git add \
            assets/github-activity-focus.svg \
            assets/github-activity-counts.svg \
            assets/github-top-languages.svg
          if git diff --cached --quiet; then
            echo "GitHub activity charts are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update github activity charts"
          git push
