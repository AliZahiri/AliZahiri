name: Update Activity Focus Chart

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate activity focus chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: AliZahiri
          GITHUB_ACTIVITY_DAYS: "365"
        run: python scripts/generate_activity_focus.py

      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/github-activity-focus.svg; then
            echo "Activity focus chart is already up to date."
            exit 0
          fi
          git config user.name "S.Ali Zahiri"
          git config user.email "1667665+AliZahiri@users.noreply.github.com"
          git add assets/github-activity-focus.svg
          git commit -m "chore: update activity focus chart"
          git push
