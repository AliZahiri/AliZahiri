name: Update Activity Focus Chart

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate GitHub activity charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: AliZahiri
          GITHUB_ACTIVITY_DAYS: "365"
        run: python scripts/generate_activity_focus.py

      - name: Commit updated charts
        run: |
          if git diff --quiet -- assets/github-activity-focus.svg assets/github-top-languages.svg; then
            echo "GitHub activity charts are already up to date."
            exit 0
          fi
          git config user.name "S.Ali Zahiri"
          git config user.email "1667665+AliZahiri@users.noreply.github.com"
          git add assets/github-activity-focus.svg assets/github-top-languages.svg
          git commit -m "chore: update github activity charts"
          git push
