<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity focus radar for AliZahiri</title>
  <desc id="desc">Activity focus for the last 365 days: 304 commits, 116 issues, 116 pull requests, and 0 code reviews.</desc>
  <!-- Generated from GitHub contribution data at 2026-07-22 UTC. -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="360" height="220" rx="10" fill="#0d1117" />

  <g stroke="#1f6feb" stroke-linecap="round">
    <line x1="180" y1="28" x2="180" y2="192" stroke-width="2" opacity="0.95" />
    <line x1="54" y1="110" x2="306" y2="110" stroke-width="2" opacity="0.95" />
    <line x1="108" y1="110" x2="208" y2="110" stroke-width="9" opacity="0.18" filter="url(#glow)" />
    <line x1="108" y1="110" x2="208" y2="110" stroke-width="4" opacity="0.72" filter="url(#glow)" />
    <line x1="180" y1="110" x2="180" y2="128" stroke-width="4" opacity="0.35" filter="url(#glow)" />
  </g>

  <g fill="#0d1117" stroke="#58a6ff" stroke-width="3" filter="url(#glow)">
    <circle cx="108" cy="110" r="4" />
    <circle cx="180" cy="110" r="5" />
    <circle cx="208" cy="110" r="4" />
    <circle cx="180" cy="110" r="3" />
    <circle cx="180" cy="128" r="3" />
  </g>

  <g fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">
    <text x="180" y="18" text-anchor="middle" fill="#9fb3c8">Code review</text>
    <text x="180" y="213" text-anchor="middle" fill="#9fb3c8">Pull requests</text>
    <text x="48" y="106" text-anchor="middle">57%</text>
    <text x="48" y="124" text-anchor="middle" fill="#9fb3c8">Commits</text>
    <text x="314" y="106" text-anchor="middle">22%</text>
    <text x="314" y="124" text-anchor="middle" fill="#9fb3c8">Issues</text>
    <text x="180" y="37" text-anchor="middle">0%</text>
    <text x="180" y="198" text-anchor="middle">22%</text>
  </g>

  <g fill="#6e7681" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">
    <text x="180" y="94" text-anchor="middle">last 365 days</text>
  </g>
</svg>
